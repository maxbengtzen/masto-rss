version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The Go version in the Dockerfile is pinned (golang:X.Y.Z-alpine) so that Go
  # patch releases, including security fixes in the standard library, show up here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
